name: Runtime validation

on:
  push:
    branches: [main, feat/dev-tools-mvp]
    paths: ['server/**', 'worker/**', 'clients/**', 'plugins/**', '.agents/plugins/**', 'scripts/**', 'Dockerfile', 'compose.yaml', '.dockerignore', '.github/workflows/**']
  pull_request:
    paths: ['server/**', 'worker/**', 'clients/**', 'plugins/**', '.agents/plugins/**', 'scripts/**', 'Dockerfile', 'compose.yaml', '.dockerignore', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            worker/package-lock.json
      - run: node scripts/verify.mjs
      - name: Validate Windows deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('scripts/deploy-windows.ps1', 'scripts/install-windows-autodeploy.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($error in $errors) {
              Write-Error "${file}:$($error.Extent.StartLineNumber): $($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Validate and build Docker deployment
        env:
          GISUL_SKILLS_PATH: /tmp/gisul-skills
          GISUL_STATE_PATH: /tmp/gisul-state
          GISUL_GIT_COMMIT: ${{ github.sha }}
        run: |
          docker compose config
          docker compose build gisul
